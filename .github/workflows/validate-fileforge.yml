name: Validate FileForge AI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check HTML JavaScript syntax
        run: |
          python - <<'PY' > /tmp/app.js
          import re
          s=open('index.html',encoding='utf-8').read()
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert blocks
          print('\n'.join(blocks))
          PY
          node --check /tmp/app.js
      - name: Count tools
        run: |
          python - <<'PY'
          s=open('index.html',encoding='utf-8').read()
          assert s.count('["') >= 100
          print("tool inventory check passed")
          PY
